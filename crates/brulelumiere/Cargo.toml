[package]
name = "brulelumiere"
version = "0.1.0"
edition = "2021"
description = "BrûleLumière — a standalone laser-project editor inspired by LightBurn: vector drawing, cut layers, G-code, GRBL machine control and image tracing."
license = "MIT"

[[bin]]
name = "brulelumiere"
path = "src/main.rs"

[dependencies]
lightburn-io = { path = "../lightburn-io" }
eframe = "0.37.0"
geo = "0.33.1"
roxmltree = "0.21.1"
serialport = "4.10.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["preserve_order"] }
