[package]
name = "lightburn-io"
version = "0.1.0"
edition = "2021"
description = "A JSON-document config store modeled on LightBurn's prefs I/O: configurable base dir, defaults layer, atomic save, rotating categorized backups, and a version guard."
license = "MIT"

[lib]
name = "lightburn_io"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["preserve_order"] }
